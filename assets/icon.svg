<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>

    <!-- Highlighter Blue Glow -->
    <linearGradient id="blueHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Highlighter Red Glow -->
    <linearGradient id="redHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Pen Body Gradient -->
    <linearGradient id="markerBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Plate -->
  <rect x="12" y="12" width="232" height="232" rx="48" fill="url(#bgGrad)" stroke="#313244" stroke-width="3"/>

  <!-- Code Line Highlights -->
  <!-- Top Highlight Pill (Blue @CORE:) -->
  <rect x="42" y="58" width="124" height="28" rx="6" fill="url(#blueHighlight)" filter="url(#shadow)"/>
  <rect x="174" y="64" width="40" height="16" rx="4" fill="#45475a" opacity="0.6"/>

  <!-- Middle Highlight Pill (Red @TODO:) -->
  <rect x="42" y="106" width="136" height="28" rx="6" fill="url(#redHighlight)" filter="url(#shadow)"/>
  <rect x="186" y="112" width="28" height="16" rx="4" fill="#45475a" opacity="0.6"/>

  <!-- Lower Text placeholder lines -->
  <rect x="42" y="156" width="100" height="14" rx="4" fill="#45475a" opacity="0.5"/>
  <rect x="42" y="184" width="75" height="14" rx="4" fill="#45475a" opacity="0.4"/>

  <!-- Stylized Highlighter Pen Tip & Body -->
  <g transform="translate(130, 85) rotate(42)">
    <!-- Nib shadow -->
    <!-- Chisel Tip -->
    <polygon points="40,2 58,2 52,24 34,24" fill="#FDE047"/>
    <!-- Chisel Tip Highlight Edge -->
    <polygon points="50,2 58,2 52,24 46,24" fill="#F59E0B"/>
    <!-- Collar -->
    <rect x="30" y="24" width="26" height="12" rx="2" fill="#475569"/>
    <!-- Barrel -->
    <rect x="25" y="36" width="36" height="85" rx="6" fill="url(#markerBody)" filter="url(#shadow)"/>
    <!-- Barrel Grip lines -->
    <line x1="28" y1="50" x2="58" y2="50" stroke="#B45309" stroke-width="2"/>
    <line x1="28" y1="58" x2="58" y2="58" stroke="#B45309" stroke-width="2"/>
    <line x1="28" y1="66" x2="58" y2="66" stroke="#B45309" stroke-width="2"/>
    <!-- Cap Base -->
    <rect x="23" y="115" width="40" height="12" rx="3" fill="#1E293B"/>
  </g>

  <!-- "@" Badge in Blue Pill -->
  <text x="50" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" letter-spacing="1">@CORE:</text>

  <!-- "@" Badge in Red Pill -->
  <text x="50" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" letter-spacing="1">@TODO:</text>
</svg>
